context:
  version: "2.4.0b1"

package:
  name: cc-plugin-wcrp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cc-plugin-wcrp/cc_plugin_wcrp-${{ version }}.tar.gz
  sha256: 7b4fa30b4732fc81db03c7c63a7012d49c16c245d453cd9b83ae7771aefefbc4

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - setuptools-scm >=3.4
    - wheel
  run:
    - python >=${{ python_min }}
    - compliance-checker >=5.1.2
    - netcdf4
    - cftime
    - toml
    - esgvoc >=5.1.0
    - pooch
    - pyfive >=1.1.1
    - pydantic >=2.12.5

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - plugins
        - checks
      pip_check: true

about:
  homepage: https://github.com/ESGF/cc-plugin-wcrp
  summary: Compliance Checker plugins for WCRP project specifications
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/ESGF/cc-plugin-wcrp

extra:
  recipe-maintainers:
    - cofinoa
